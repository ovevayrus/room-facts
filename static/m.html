<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Room Facts · Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--venue:#0D0E11;--panel:#16181D;--ink:#EEF0F4;--muted:#949AA6;--line:#2A2D35;--accent:#FFD33D;--accent-ink:#1E1600;--f-num:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--f-text:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--venue);color:var(--ink);font:16px/1.45 var(--f-text)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}main{width:min(100%,520px);margin:auto;padding:24px 18px 64px}.brand{font:700 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:28px}.step{font:700 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{font:900 clamp(3.5rem,18vw,6rem)/.86 var(--f-num);text-transform:uppercase;letter-spacing:.01em;margin:10px 0 22px}h2{font:800 2.2rem/.95 var(--f-num);text-transform:uppercase;margin:0 0 10px}.lead{font-size:1.12rem;margin:0 0 24px}.muted,.note{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 20px}.hero{background:#FF5A1F;color:#1B0A00;border:0}.hero .number{font:900 6rem/.8 var(--f-num);display:block;margin:6px 0}.hero .line{font-weight:800;font-size:1.55rem;line-height:1.1}.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:18px}.chip{font:700 .68rem var(--f-mono);padding:7px 9px;border:1px solid currentColor;border-radius:99px}.arrow{font:700 .8rem var(--f-mono)}.button{display:block;width:100%;min-height:54px;border-radius:10px;padding:12px 16px;text-align:center;font-weight:800;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);margin:10px 0}.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.search{width:100%;min-height:54px;background:var(--panel);color:var(--ink);border:1px solid var(--muted);border-radius:10px;padding:12px 14px;font-size:1.1rem}.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:68px;color:var(--ink);margin:8px 0}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}.avatar.fallback{display:grid;place-items:center;font:800 1.5rem var(--f-num);color:var(--accent)}.row small{display:block;color:var(--muted);font-size:.75rem}.check{display:flex;gap:12px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}.check input{width:23px;height:23px;accent-color:var(--accent);flex:none;margin:2px 0 0}.check span{flex:1}.check small{display:block;color:var(--muted);margin-top:3px}.error{color:#FF9C9C;min-height:1.5em;margin:10px 0}.person-link{color:var(--accent);font-weight:700;overflow-wrap:anywhere}.count{font:900 3.5rem/.9 var(--f-num);color:var(--accent);margin:0 0 12px}.divider{height:1px;background:var(--line);margin:20px 0}@media(min-width:600px){main{padding-top:40px}}

.spinner{display:inline-block;width:1.1em;height:1.1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}.loading{display:flex;align-items:center;justify-content:center;gap:10px}.loading-message{justify-content:flex-start;color:var(--muted);padding:12px 0}button[aria-busy="true"]{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head><body><main><div class="brand">Room Facts / Connect in the room</div><div id="app" aria-live="polite"></div></main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const mock = new URLSearchParams(location.search).get("mock") === "1";
  const scannedId = new URLSearchParams(location.search).get("f");
  const sampleFacts = [
    {id:"school:uc-berkeley",kind:"school",n:4,opted_in:2,line:"people here studied at UC Berkeley",src:"LinkedIn education",pattern:"(p)-[:STUDIED_AT]->(s:School)",path:["You","STUDIED_AT","UC Berkeley","STUDIED_AT","3 others"]},
    {id:"company:acme",kind:"company",n:3,opted_in:1,line:"people here have worked at Acme",src:"LinkedIn experience",pattern:"(p)-[:WORKED_AT]->(c:Company)",path:["You","WORKED_AT","Acme","WORKED_AT","2 others"]},
    {id:"school:stanford",kind:"school",n:3,opted_in:1,line:"people here studied at Stanford",src:"LinkedIn education",pattern:"(p)-[:STUDIED_AT]->(s:School)",path:["You","STUDIED_AT","Stanford","STUDIED_AT","2 others"]}
  ];
  const samplePeople = [
    {id:"p1",name:"Alex Rivera",avatar:"",linkedin:"alex-rivera"},
    {id:"p2",name:"Jordan Kim",avatar:"",linkedin:"jordan-kim"},
    {id:"p3",name:"Sam Patel",avatar:"",linkedin:"sam-patel"}
  ];
  const samplePersonFacts = [
    {fact_id:"school:uc-berkeley",kind:"school",line_you:"You studied at UC Berkeley",n_if_eligible:4,hidden:false},
    {fact_id:"company:acme",kind:"company",line_you:"You have worked at Acme",n_if_eligible:3,hidden:false},
    {fact_id:null,kind:"city",line_you:"You live in Oakland",n_if_eligible:null,hidden:false}
  ];
  let stage = "intro", fact = null, person = null, optedIn = null, personFacts = [], searchTimer = 0, searchSeq = 0;
  let mockOpted = false, mockHidden = [];
  const app = $("#app");
  const error = message => { const el = $("#error"); if (el) el.textContent = message; };
  const loading = label => `<span class="loading"><span class="spinner" aria-hidden="true"></span><span>${esc(label)}</span></span>`;
  const loadingMessage = label => `<p class="loading loading-message" role="status"><span class="spinner" aria-hidden="true"></span><span>${esc(label)}</span></p>`;
  let busy = false;
  async function runAction(button, label, action, message) {
    if (busy || !button || !button.isConnected) return;
    busy = true;
    error("");
    const original = button.innerHTML;
    const controls = [...app.querySelectorAll("button,input")].map(el => [el, el.disabled]);
    controls.forEach(([el]) => { el.disabled = true; });
    button.setAttribute("aria-busy", "true");
    button.innerHTML = loading(label);
    try { await action(); }
    catch (e) { error(message); }
    finally {
      controls.forEach(([el, disabled]) => { el.disabled = disabled; });
      button.removeAttribute("aria-busy");
      button.innerHTML = original;
      busy = false;
    }
  }
  function leave() {
    return runAction($("#leave"), "Leaving…", async () => {
      await api("/api/optout", {method:"POST"});
      person = null; optedIn = null; personFacts = []; intro();
    }, "Could not leave Room Facts. Please try again.");
  }
  async function api(path, options = {}) {
    if (mock) return mockApi(path, options);
    const response = await fetch(path, { credentials:"same-origin", ...options });
    if (!response.ok) { const e = new Error(`Request failed (${response.status})`); e.status = response.status; throw e; }
    return response.json();
  }
  function mockApi(path, options) {
    const raw = decodeURIComponent(path);
    if (raw === "/api/me") { if (mockOpted) return Promise.resolve(person || samplePeople[0]); const e = new Error("Not opted in"); e.status = 401; return Promise.reject(e); }
    if (raw.startsWith("/api/fact/") && raw.endsWith("/people")) {
      const id = raw.slice(10, -7);
      const ownFacts = person?.id === "p3" ? samplePersonFacts.slice(2) : samplePersonFacts;
      if (!mockOpted || !ownFacts.some(f => f.fact_id === id && f.n_if_eligible != null) || mockHidden.includes(id)) { const e = new Error("Not eligible"); e.status = 403; return Promise.reject(e); }
      const other = person?.id === "p2" ? samplePeople[0] : samplePeople[1];
      return Promise.resolve({people:[{name:other.name,avatar:other.avatar,linkedin_url:linkedinURL(other)}],hidden_count:id === "company:acme" ? 1 : 2});
    }
    if (raw.startsWith("/api/fact/")) { const item = sampleFacts.find(f => f.id === raw.slice(10)); if (item) return Promise.resolve(item); const e = new Error("Fact not found"); e.status = 404; return Promise.reject(e); }
    if (raw === "/api/connections") { if (!mockOpted) { const e = new Error("Not opted in"); e.status = 401; return Promise.reject(e); } return Promise.resolve({people:[{name:samplePeople[1].name,avatar:"",linkedin:samplePeople[1].linkedin,shared:[{line:"You both studied at UC Berkeley",path:["You","STUDIED_AT","UC Berkeley","STUDIED_AT","Jordan"]}],more:1}]}); }
    if (raw.startsWith("/api/stats")) return Promise.resolve({opted_in:mockOpted ? 2 : 1});
    if (raw.startsWith("/api/people/search")) { const q = new URL(path, location.href).searchParams.get("q").toLowerCase(); return Promise.resolve(samplePeople.filter(p => p.name.toLowerCase().includes(q)).slice(0,8)); }
    if (raw.startsWith("/api/person/") && raw.endsWith("/facts")) return Promise.resolve((raw.slice(12, -6) === "p3" ? samplePersonFacts.slice(2) : samplePersonFacts).map(f => ({...f,hidden:mockHidden.includes(f.fact_id)})));
    if (raw.startsWith("/api/person/")) return Promise.resolve(samplePeople.find(p => p.id === raw.slice(12)) || samplePeople[0]);
    if (raw === "/api/optin") { mockOpted = true; mockHidden = JSON.parse(options.body).hide; return Promise.resolve({ok:true,person}); }
    if (raw === "/api/me/facts") { const b = JSON.parse(options.body); mockHidden = [...new Set([...mockHidden, ...b.hide])].filter(id => !b.show.includes(id)); return Promise.resolve([]); }
    if (raw === "/api/optout") { mockOpted = false; mockHidden = []; return Promise.resolve({ok:true}); }
    return Promise.reject(new Error("Unknown mock endpoint"));
  }
  function heading(label, title, lead = "") { return `<div class="step">${esc(label)}</div><h1>${esc(title)}</h1>${lead ? `<p class="lead">${esc(lead)}</p>` : ""}`; }
  function avatar(p) { return p.avatar ? `<img class="avatar" src="${esc(p.avatar)}" alt="">` : `<span class="avatar fallback" aria-hidden="true">${esc((p.name || "?")[0])}</span>`; }
  function linkedinURL(p) {
    if (p.linkedin_url) { try { const u = new URL(p.linkedin_url); return u.protocol === "https:" && (u.hostname === "linkedin.com" || u.hostname.endsWith(".linkedin.com")) ? u.href : ""; } catch { return ""; } }
    const slug = String(p.linkedin || "").replace(/^\/?in\//, "").replace(/^\/+|\/+$/g, "");
    return slug && /^[a-z\d_-]+$/i.test(slug) ? `https://www.linkedin.com/in/${encodeURIComponent(slug)}/` : "";
  }
  function pathChips(path) {
    if (!Array.isArray(path)) return "";
    return `<div class="chips">${path.map((part,i) => `${i ? `<span class="arrow">${i === path.length - 1 ? "←" : "→"}</span>` : ""}<span class="chip">${esc(part)}</span>`).join("")}</div>`;
  }
  function intro() {
    stage = "intro";
    app.innerHTML = heading("01 / Room Facts", "What do you share?", "Find out what you have in common with people here, and meet the ones who opted in.") +
      (fact ? `<p class="step" style="margin:0 0 8px">On the screen you scanned</p><div class="card hero"><span class="number">${esc(fact.n)}</span><div class="line">${esc(fact.line)}</div></div>` : `<div class="card hero"><h2>Real people. Shared stories.</h2><p>Names stay hidden until you opt in.</p></div>`) +
      `<button class="button" id="start">Find out what you share</button>${optedIn ? `<button class="button secondary" id="mine">See your people</button>` : ""}<p class="note">Your name is shown only to people who also opt in and share a fact with you.</p><p class="error" id="error" role="alert"></p>`;
    $("#start").onclick = search;
    // Already opted in: scanning again still offers opt-in, with a shortcut back to your people.
    if (optedIn) $("#mine").onclick = () => { person = optedIn; void results(); };
  }
  function search() {
    stage = "search";
    app.innerHTML = heading("02 / Find yourself", "Search your name", "Start typing your name or LinkedIn handle.") +
      `<label for="name">Name</label><input class="search" id="name" autocomplete="name" placeholder="Your name" type="search"><div id="results"></div><p class="error" id="error" role="alert"></p><button class="button secondary" id="back">Back</button>`;
    $("#back").onclick = intro;
    $("#name").oninput = () => { clearTimeout(searchTimer); const q = $("#name").value.trim(); const seq = ++searchSeq; $("#results").innerHTML = q.length < 2 ? `<p class="muted">Enter at least 2 characters.</p>` : loadingMessage("Searching…"); if (q.length >= 2) searchTimer = setTimeout(() => runSearch(q, seq), 250); };
    $("#name").focus();
  }
  async function runSearch(q, seq) {
    try {
      const rows = await api(`/api/people/search?q=${encodeURIComponent(q)}`);
      if (busy || stage !== "search" || seq !== searchSeq) return;
      if (!Array.isArray(rows)) throw new Error("Invalid search response");
      if (!rows.length && q.length >= 3) {
        $("#results").innerHTML = loadingMessage("Looking for close matches…");
        const close = await api(`/api/people/search?fuzzy=1&q=${encodeURIComponent(q)}`);
        if (busy || stage !== "search" || seq !== searchSeq) return;
        if (Array.isArray(close)) rows.push(...close);
      }
      $("#results").innerHTML = rows.length ? (rows[0].suggested ? `<p class="muted">Did you mean:</p>` : "") + rows.slice(0,8).map((p,i) => `<button class="row" data-index="${i}">${avatar(p)}<span>${esc(p.name)}</span></button>`).join("") : `<p class="muted">No matches found. Try another spelling, or your LinkedIn handle.</p>`;
      $("#results").onclick = async e => { const button = e.target.closest("button[data-index]"); if (button) await choose(rows[+button.dataset.index], button); };
      error("");
    } catch (e) {
      if (busy || stage !== "search" || seq !== searchSeq) return;
      error(e.status === 429 ? "Too many searches. Wait a moment and try again." : "Search is unavailable. Please try again.");
    }
  }
  function choose(result, button) {
    return runAction(button, "Loading profile…", async () => {
      person = await api(`/api/person/${encodeURIComponent(result.id)}`); confirmPerson();
    }, "Could not load this person. Please try again.");
  }
  function confirmPerson() {
    stage = "confirm";
    const link = linkedinURL(person);
    app.innerHTML = heading("03 / Confirm", "Is this you?", "Check this profile before continuing.") +
      `<div class="card"><div class="row" style="border:0;padding:0">${avatar(person)}<strong>${esc(person.name)}</strong></div>${link ? `<p><a class="person-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(link.replace(/^https:\/\/(www\.)?/, ""))}</a></p>` : ""}</div>` +
      `<button class="button" id="yes">Yes, that's me</button><button class="button secondary" id="no">Not me</button><p class="error" id="error" role="alert"></p>`;
    $("#yes").onclick = loadPersonFacts; $("#no").onclick = search;
  }
  function loadPersonFacts() {
    return runAction($("#yes"), "Loading your facts…", async () => {
      const rows = await api(`/api/person/${encodeURIComponent(person.id)}/facts`);
      if (!Array.isArray(rows)) throw new Error("Invalid facts response");
      personFacts = rows; yourFacts();
    }, "Could not load your facts. Please try again.");
  }
  function yourFacts() {
    stage = "facts";
    app.innerHTML = heading("04 / Your facts", "Choose what counts", "Uncheck anything that's wrong. It won't count.") +
      `<div class="card">${personFacts.length ? personFacts.map((f,i) => `<label class="check"><input type="checkbox" data-index="${i}"${f.hidden || f.pending ? "" : " checked"}><span>${esc(f.line_you)}${f.n_if_eligible != null ? `<small>${esc(f.n_if_eligible)} people share this fact</small>` : ""}</span></label>`).join("") : `<p class="muted">No facts found yet. You can still join.</p>`}</div>` +
      `<button class="button" id="optin">Opt in and see who else</button><button class="button secondary" id="back">Back</button><p class="error" id="error" role="alert"></p>`;
    $("#back").onclick = confirmPerson;
    $("#optin").onclick = optIn;
  }
  async function optIn() {
    const hide = personFacts.filter((f,i) => f.fact_id && !app.querySelector(`input[data-index="${i}"]`).checked).map(f => f.fact_id);
    return runAction($("#optin"), "Joining…", async () => {
      await api("/api/optin", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({person_id:person.id,hide})});
      optedIn = person;
      void results();
    }, "Could not opt in. Please try again.");
  }
  function personRow(p) {
    const link = linkedinURL(p);
    const [first, ...rest] = Array.isArray(p.shared) ? p.shared : [];
    return `<div class="card"><div class="row" style="border:0;padding:0;min-height:0">${avatar(p)}<span><strong>${esc(p.name)}</strong>${link ? `<small><a class="person-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">LinkedIn profile</a></small>` : ""}</span></div>` +
      (first ? `<p style="margin:14px 0 0;font-weight:700">${esc(first.line)}</p>${pathChips(first.path)}` : "") +
      rest.map(s => `<p style="margin:10px 0 0">${esc(s.line)}</p>`).join("") +
      (p.more ? `<p class="note" style="margin:10px 0 0">+${esc(p.more)} more in common</p>` : "") + `</div>`;
  }
  async function loadConnections() {
    if (stage !== "results") return;
    const matches = $("#matches"), count = $("#opted-count");
    if (!matches || matches.dataset.loading === "true") return;
    matches.dataset.loading = "true";
    void api("/api/stats").then(stats => {
      if (!count.isConnected || !Number.isFinite(stats.opted_in)) return;
      const total = Math.max(stats.opted_in - 1, 0);
      count.textContent = `${total} other ${total === 1 ? "person has" : "people have"} opted in so far. Updates every 15 seconds.`;
    }).catch(() => {});
    try {
      const data = await api("/api/connections");
      if (!matches.isConnected || stage !== "results") return;
      const people = Array.isArray(data.people) ? data.people : [];
      matches.innerHTML = people.length ? `<p class="count">${esc(people.length)}</p><h2>${people.length === 1 ? "Person" : "People"} you share facts with</h2>${people.map(personRow).join("")}`
        : `<div class="card"><h2>No one yet</h2><p class="muted">No one who shares a fact with you has opted in yet. Keep this page open; it updates on its own.</p></div>`;
      error("");
    } catch (e) {
      if (!matches.isConnected || stage !== "results") return;
      if (e.status === 401) { person = null; optedIn = null; intro(); return; }
      matches.innerHTML = `<p class="muted">Your people could not load right now.</p><button class="button" id="retry-people">Try again</button>`;
      $("#retry-people").onclick = loadConnections;
      error("Could not load people right now. Retrying…");
    } finally { delete matches.dataset.loading; }
  }
  async function refreshScannedFact(container, viewer, id) {
    try {
      const [rows, detail] = await Promise.all([
        api(`/api/person/${encodeURIComponent(viewer)}/facts`),
        api(`/api/fact/${encodeURIComponent(id)}`)
      ]);
      if (!container.isConnected || stage !== "results" || person?.id !== viewer) return;
      personFacts = rows;
      if (rows.some(f => f.fact_id === id && !f.hidden && !f.pending)) {
        fact = detail;
        container.innerHTML = `<div class="card hero"><span class="number">${esc(detail.n)}</span><div class="line">${esc(detail.line)}</div><p style="margin:12px 0 0">${esc(detail.opted_in ?? 0)} of them have opted in.</p></div>`;
      }
    } catch (e) { /* The optional scanned fact must not hold up the people cards. */ }
  }
  async function results() {
    stage = "results";
    app.innerHTML = heading("05 / People in this room", "You're in", "These people opted in too, and you share something with them.") + `<div id="scanned-fact"></div><div id="matches">${loadingMessage("Finding people you share facts with…")}</div><p class="note" id="opted-count">Updates every 15 seconds.</p><div id="review"></div><button class="button secondary" id="leave">Leave Room Facts</button><p class="error" id="error" role="alert"></p>`;
    $("#leave").onclick = leave;
    if (fact && person) void refreshScannedFact($("#scanned-fact"), person.id, fact.id);
    void loadReview(person.id);
    await loadConnections();
  }
  async function loadReview(viewer) {
    try {
      const rows = await api(`/api/person/${encodeURIComponent(viewer)}/facts`);
      if (stage !== "results" || person?.id !== viewer || !$("#review")) return;
      personFacts = rows; reviewFacts();
    } catch (e) { /* Reviewing facts is optional; the people list still loads. */ }
  }
  function reviewFacts() {
    const rows = personFacts.filter(f => f.fact_id);
    const pending = rows.filter(f => f.pending).length;
    $("#review").innerHTML = rows.length ? `<section class="card"><h2>Review your facts</h2><p class="muted">${pending ? `${esc(pending)} fact${pending === 1 ? "" : "s"} won't count until you approve ${pending === 1 ? "it" : "them"}.` : "Checked facts count. Uncheck anything you'd rather hide."}</p>` +
      rows.map((f,i) => `<label class="check"><input type="checkbox" data-review="${i}"${f.hidden || f.pending ? "" : " checked"}><span>${esc(f.line_you)}<small>${f.pending ? "Not reviewed yet" : f.hidden ? "Hidden" : "Counts"}${f.n_if_eligible != null ? ` · ${esc(f.n_if_eligible)} people` : ""}</small></span></label>`).join("") +
      `<button class="button" id="save-facts">Save my facts</button></section>` : "";
    if (!rows.length) return;
    $("#save-facts").onclick = async () => {
      const show = [], hide = [];
      rows.forEach((f,i) => { const on = $(`input[data-review="${i}"]`).checked; if (on && (f.hidden || f.pending)) show.push(f.fact_id); if (!on && !f.hidden && !f.pending) hide.push(f.fact_id); });
      return runAction($("#save-facts"), "Saving…", async () => {
        await api("/api/me/facts", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hide,show})});
        void results();
      }, "Could not save your facts. Please try again.");
    };
  }
  setInterval(loadConnections, 15000);
  async function start() {
    app.innerHTML = loadingMessage("Loading Room Facts…");
    const [scanned, me] = await Promise.all([
      scannedId ? api(`/api/fact/${encodeURIComponent(scannedId)}`).catch(() => null) : Promise.resolve(null),
      api("/api/me").catch(() => null)
    ]);
    fact = scanned; optedIn = me;
    intro();
  }
  start();
})();
</script></body></html>
